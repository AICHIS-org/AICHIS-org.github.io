# Runs on every pull request into main. No build step — this is a static
# site — so these are cheap sanity checks that catch the mistakes that
# actually break the page: a JS typo, a missing translation, a renamed or
# missing photo — plus a security check on what the change adds.
#
# Security notes for maintainers:
# - Keep the trigger as `pull_request` (never `pull_request_target`): this way
#   a PR from a fork runs with a read-only token and no access to secrets.
# - Actions are pinned to a full commit hash; Dependabot proposes updates.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax-check JS files
        run: |
          node -c assets/js/content.js
          node -c assets/js/main.js

      - name: Validate content.js (translations + photo paths)
        run: node scripts/check-content.js

      - name: Security check (links, embeds, scripts, workflows)
        run: node scripts/check-security.js
